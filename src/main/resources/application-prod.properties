# ========================
# PRODUCTION CONFIG (Railway)
# ========================

# Railway provides these variables automatically when you add MySQL plugin:
# MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 disabled in production
spring.h2.console.enabled=false

# Thymeleaf cache on
spring.thymeleaf.cache=true

# Port - Railway sets this automatically
server.port=${PORT:8080}

# Logging
logging.level.com.campus=INFO
logging.level.org.springframework.security=WARN

# Email disabled by default
app.mail.enabled=false
