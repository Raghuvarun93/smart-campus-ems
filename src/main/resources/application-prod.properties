# ========================
# PRODUCTION CONFIG (Railway)
# ========================

# Railway MySQL plugin provides MYSQL_URL in format:
# mysql://user:password@host:port/database
# Spring needs jdbc:mysql:// format so we use individual vars as fallback

# Option 1: Use MYSQL_PUBLIC_URL or MYSQL_URL if Railway sets it
# Option 2: Use individual variables
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:campusdb}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 disabled
spring.h2.console.enabled=false

# Thymeleaf
spring.thymeleaf.cache=true

# Port
server.port=${PORT:8080}

# Logging
logging.level.com.campus=INFO
logging.level.org.springframework.security=WARN

# Email
app.mail.enabled=false
