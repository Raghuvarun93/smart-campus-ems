<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up - Campus EMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="form-card form-card-wide" style="max-width:640px;">
        <div class="form-title">🎓 Create Your Account</div>
        <div class="form-subtitle">Join Campus EMS to discover and register for events</div>

        <div th:if="${errorMessage}" class="alert alert-error">
            🚫 <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/signup}" method="post">

            <div class="section-title" style="margin-bottom:1rem;">👤 Account Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name *</label>
                    <input type="text" name="fullName" class="form-control"
                           placeholder="e.g. Varun Kumar" required
                           th:value="${param.fullName}"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Username *</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Choose a username" required
                           th:value="${param.username}"/>
                    <small class="text-muted">Used to log in. No spaces.</small>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control"
                       placeholder="you@example.com" required
                       th:value="${param.email}"/>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Password *</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Min. 6 characters" required minlength="6"/>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password *</label>
                    <input type="password" name="confirmPassword" class="form-control"
                           placeholder="Repeat your password" required/>
                </div>
            </div>

            <hr class="divider"/>
            <div class="section-title" style="margin-bottom:1rem;">🎓 Student Profile (optional)</div>
            <div class="form-subtitle" style="margin-bottom:1rem;">Fill this in to register for events right away.</div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <select name="department" class="form-control">
                        <option value="">-- Select Department --</option>
                        <option value="CSE">Computer Science &amp; Engineering</option>
                        <option value="ECE">Electronics &amp; Communication</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="MBA">Master of Business Admin</option>
                        <option value="MCA">Master of Computer Applications</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Academic Year</label>
                    <select name="year" class="form-control">
                        <option value="">-- Select Year --</option>
                        <option value="1st Year">1st Year</option>
                        <option value="2nd Year">2nd Year</option>
                        <option value="3rd Year">3rd Year</option>
                        <option value="4th Year">4th Year</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control"
                       placeholder="10-digit mobile number"
                       pattern="[0-9]{10}" title="Enter a 10-digit phone number"/>
            </div>

            <button type="submit" class="btn btn-success btn-full btn-lg" style="margin-top:0.5rem;">
                🚀 Create Account
            </button>
        </form>

        <hr class="divider"/>
        <div style="text-align:center;font-size:0.9rem;">
            Already have an account?
            <a th:href="@{/login}" style="color:var(--primary);font-weight:600;">Sign In →</a>
        </div>
        <div style="text-align:center;margin-top:0.5rem;">
            <a th:href="@{/events}" class="text-muted">← Browse Events without signing up</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
