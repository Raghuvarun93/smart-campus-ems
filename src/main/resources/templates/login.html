<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Campus EMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">
            <span class="login-logo-icon">🎓</span>
            <div class="login-title">Campus EMS</div>
            <div class="login-subtitle">Smart Event Management System</div>
        </div>

        <div th:if="${loginError}" class="alert alert-error">
            🚫 <span th:text="${loginError}"></span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-info">
            ✅ <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label class="form-label">👤 Username</label>
                <input type="text" name="username" class="form-control"
                       placeholder="Enter your username" required autofocus/>
            </div>
            <div class="form-group">
                <label class="form-label">🔒 Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Enter your password" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:0.5rem;">
                🔑 Sign In
            </button>
        </form>

        <hr class="divider"/>

        <div style="background:var(--gray-100);border-radius:8px;padding:1rem;font-size:0.85rem;">
            <div style="font-weight:700;margin-bottom:0.5rem;">🧪 Demo Credentials</div>
            <div>🔴 <strong>Admin:</strong> admin / admin123</div>
            <div style="margin-top:0.3rem;">🟢 <strong>Student:</strong> student / student123</div>
        </div>

        <div style="text-align:center;margin-top:1.25rem;">
            <a th:href="@{/events}" class="text-muted">← Back to Events</a>
            &nbsp;|&nbsp;
            <a th:href="@{/signup}" style="color:var(--primary);font-weight:600;">✨ Create Account</a>
        </div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
