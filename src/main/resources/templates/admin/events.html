<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Events – Campus EMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="page-header">
        <div>
            <div class="page-title">📋 Manage Events</div>
            <div class="page-subtitle">Add, edit, delete and search all campus events</div>
        </div>
        <a th:href="@{/admin/events/new}" class="btn btn-primary">➕ New Event</a>
    </div>

    <!-- ── Filter Bar ── -->
    <form th:action="@{/admin/events}" method="get" id="adminFilterForm">
        <div class="filter-bar">

            <div class="form-group">
                <label class="form-label">🏢 Department</label>
                <select name="department" class="form-control"
                        onchange="document.getElementById('adminFilterForm').submit()">
                    <option value="">All Departments</option>
                    <option value="CSE"   th:selected="${department == 'CSE'}">CSE</option>
                    <option value="ECE"   th:selected="${department == 'ECE'}">ECE</option>
                    <option value="MECH"  th:selected="${department == 'MECH'}">MECH</option>
                    <option value="CIVIL" th:selected="${department == 'CIVIL'}">CIVIL</option>
                    <option value="MBA"   th:selected="${department == 'MBA'}">MBA</option>
                    <option value="MCA"   th:selected="${department == 'MCA'}">MCA</option>
                    <option value="ALL"   th:selected="${department == 'ALL'}">ALL</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">🎯 Event Type</label>
                <select name="eventType" class="form-control"
                        onchange="document.getElementById('adminFilterForm').submit()">
                    <option value="">All Types</option>
                    <option value="Workshop"    th:selected="${eventType == 'Workshop'}">🔧 Workshop</option>
                    <option value="Seminar"     th:selected="${eventType == 'Seminar'}">🎤 Seminar</option>
                    <option value="Competition" th:selected="${eventType == 'Competition'}">🏆 Competition</option>
                    <option value="Cultural"    th:selected="${eventType == 'Cultural'}">🎭 Cultural</option>
                    <option value="Sports"      th:selected="${eventType == 'Sports'}">⚽ Sports</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">📌 Status</label>
                <select name="status" class="form-control"
                        onchange="document.getElementById('adminFilterForm').submit()">
                    <option value="">All Status</option>
                    <option value="UPCOMING"  th:selected="${status == 'UPCOMING'}">🟢 Upcoming</option>
                    <option value="ONGOING"   th:selected="${status == 'ONGOING'}">🟡 Ongoing</option>
                    <option value="COMPLETED" th:selected="${status == 'COMPLETED'}">⚫ Completed</option>
                    <option value="CANCELLED" th:selected="${status == 'CANCELLED'}">🔴 Cancelled</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">📅 Date From</label>
                <input type="date" name="dateFrom" class="form-control"
                       th:value="${dateFrom}"
                       onchange="document.getElementById('adminFilterForm').submit()"/>
            </div>

            <div class="form-group">
                <label class="form-label">📅 Date To</label>
                <input type="date" name="dateTo" class="form-control"
                       th:value="${dateTo}"
                       onchange="document.getElementById('adminFilterForm').submit()"/>
            </div>

            <div class="form-group" style="flex:2;">
                <label class="form-label">🔍 Keyword</label>
                <input type="text" name="keyword" class="form-control"
                       placeholder="Search by title..."
                       th:value="${keyword}"
                       onkeydown="searchOnEnter(event,'adminFilterForm')"/>
            </div>

            <div class="form-group" style="align-self:flex-end;">
                <button type="submit" class="btn btn-primary">🔍 Search</button>
            </div>
            <div class="form-group" style="align-self:flex-end;">
                <a th:href="@{/admin/events}" class="btn btn-outline">✖ Clear</a>
            </div>
        </div>
    </form>

    <!-- Active filter summary -->
    <div th:if="${department != null and department != '' or
                  eventType != null and eventType != '' or
                  status != null and status != '' or
                  dateFrom != null or dateTo != null or
                  keyword != null and keyword != ''}"
         style="margin-bottom:1rem;font-size:0.88rem;color:var(--gray-600);display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
        <strong>Active filters:</strong>
        <span class="badge badge-blue" th:if="${department != null and department != ''}">Dept: <span th:text="${department}"></span></span>
        <span class="badge badge-blue" th:if="${eventType != null and eventType != ''}">Type: <span th:text="${eventType}"></span></span>
        <span class="badge badge-blue" th:if="${status != null and status != ''}">Status: <span th:text="${status}"></span></span>
        <span class="badge badge-blue" th:if="${dateFrom != null}">From: <span th:text="${dateFrom}"></span></span>
        <span class="badge badge-blue" th:if="${dateTo != null}">To: <span th:text="${dateTo}"></span></span>
        <span class="badge badge-blue" th:if="${keyword != null and keyword != ''}">Keyword: "<span th:text="${keyword}"></span>"</span>
        <span style="color:var(--gray-400);">— <strong th:text="${#lists.size(events)}"></strong> result(s)</span>
    </div>

    <!-- ── Events Table ── -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Event Title</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Venue</th>
                    <th>Dept</th>
                    <th>Registrations</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event, idx : ${events}">
                    <td th:text="${idx.count}" style="color:var(--gray-400);font-size:0.82rem;"></td>
                    <td>
                        <div style="font-weight:600;color:var(--dark);" th:text="${event.title}"></div>
                        <div class="text-muted">👨‍🏫 <span th:text="${event.organizer}"></span></div>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${event.eventType == 'Workshop'} ? 'badge-blue' :
                                              (${event.eventType == 'Seminar'} ? 'badge-purple' :
                                              (${event.eventType == 'Competition'} ? 'badge-green' :
                                              (${event.eventType == 'Cultural'} ? 'badge-orange' : 'badge-red')))"
                              th:text="${event.eventType}"></span>
                    </td>
                    <td>
                        <div th:text="${#temporals.format(event.eventDate,'dd MMM yyyy')}"></div>
                        <div class="text-muted" th:if="${event.startTime != null}"
                             th:text="${#temporals.format(event.startTime,'hh:mm a')}"></div>
                    </td>
                    <td th:text="${event.venue}"></td>
                    <td><span class="badge badge-blue" th:text="${event.department}"></span></td>
                    <td>
                        <div style="font-weight:600;" th:text="${event.registeredCount} + ' / ' + ${event.totalCapacity}"></div>
                        <div class="progress-bar-container" style="margin-top:4px;">
                            <div class="progress-bar"
                                 th:attr="data-percent=${event.totalCapacity > 0 ? (event.registeredCount * 100 / event.totalCapacity) : 0}"></div>
                        </div>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${event.status == 'UPCOMING'} ? 'badge-green' :
                                              (${event.status == 'ONGOING'} ? 'badge-orange' :
                                              (${event.status == 'CANCELLED'} ? 'badge-red' : 'badge-gray'))"
                              th:text="${event.status}"></span>
                    </td>
                    <td>
                        <div class="action-buttons">
                            <a th:href="@{/admin/events/{id}/edit(id=${event.id})}"
                               class="btn btn-warning btn-sm" title="Edit Event">✏️ Edit</a>
                            <a th:href="@{/admin/events/{id}/registrations(id=${event.id})}"
                               class="btn btn-primary btn-sm" title="View Registrations">👥 Regs</a>
                            <form th:action="@{/admin/events/{id}/delete(id=${event.id})}"
                                  method="post" class="confirm-delete" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm" title="Delete Event">🗑️</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(events)}">
                    <td colspan="9" style="text-align:center;padding:3rem;color:var(--gray-400);">
                        <div style="font-size:2rem;margin-bottom:0.5rem;">📭</div>
                        No events match your filters.
                        <a th:href="@{/admin/events/new}" style="color:var(--primary);font-weight:600;">Create one →</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
